<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>リトサン shooting challenge!!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paint:#4a9bff; --amber:#ffc24a;
  --panel:#0f1b31; --panel-2:#16253f; --panel-edge:rgba(126,176,255,.26);
  --ink:#eaf1fb; --ink-soft:#9db2d6;
  --btn:#2f7bd6; --btn-shadow:#12407f;
  --seg:rgba(255,255,255,.07); --seg-on:#2f7bd6; --seg-on-ink:#ffffff;
  --page:#080f1d; --err:#ff8a75;
  --font-d:'Dela Gothic One','M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --font-b:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic','Meiryo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--page);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font-b);color:var(--ink);-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:min(100vw,480px);height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#101a30;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#court{position:absolute;inset:0;width:100%;height:100%;display:block}
button{touch-action:manipulation;cursor:pointer}
input:focus-visible,button:focus-visible{outline:3px solid #2f7bd6;outline-offset:2px}

.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;touch-action:pan-y}
.screen.show{display:flex}

/* タイトル */
#title{justify-content:space-between}
.banner-wrap{padding-top:calc(env(safe-area-inset-top) + 3px);display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
.rod{width:min(92%,390px);height:8px;border-radius:5px;background:linear-gradient(#cfd8e8,#7a8699);box-shadow:0 3px 0 rgba(0,0,0,.35);position:relative;z-index:1}
.banner{position:relative;width:min(82%,340px);margin-top:-3px;color:#eaf1fb;text-align:center;
  background:linear-gradient(180deg,#1f63c8,#0f2c5c);padding:6px 10px 20px;clip-path:polygon(0 0,100% 0,100% 88%,50% 100%,0 88%);
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
.banner::after{content:"";position:absolute;left:0;right:0;bottom:12px;height:7px;
  background:linear-gradient(var(--amber) 0 3px,transparent 3px 5px,rgba(234,241,251,.9) 5px 7px)}
.b-sub{font-weight:800;font-size:12px;letter-spacing:.34em;color:#bcd4ff}
.banner h1{font-family:var(--font-d);font-weight:400;font-size:clamp(22px,7vw,30px);line-height:1.1;margin-top:1px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.b-ch{display:block;font-size:.74em}

.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel));color:var(--ink);display:flex;flex-direction:column;gap:7px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sheet{border-top:1px solid var(--panel-edge);border-radius:22px 22px 0 0;padding:12px 14px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -14px 40px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.14) inset}
.card{border:1px solid var(--panel-edge);border-radius:24px;padding:18px;margin:auto 14px;
  box-shadow:0 16px 50px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.12) inset}
.lbl{display:block;font-size:10px;font-weight:800;color:var(--ink-soft);letter-spacing:.12em;margin-bottom:4px}
input{width:100%;font:700 15px var(--font-b);padding:8px 12px;border-radius:12px;border:1px solid var(--panel-edge);
  background:rgba(255,255,255,.06);color:var(--ink);user-select:text;-webkit-user-select:text}
input::placeholder{color:#6f85ab}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.seg.two{grid-template-columns:1fr 1fr}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four button{padding:7px 2px}
.seg.spots{grid-template-columns:repeat(3,1fr)}
.seg.spots button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.2;padding:5px 2px}
.seg.spots button small{font-size:10px;font-weight:800;color:var(--amber);opacity:.95}
.seg.spots button[aria-pressed="true"] small{color:#ffeab5}
.seg button{font:800 14px var(--font-b);padding:7px 4px;border-radius:12px;color:var(--ink);
  border:1px solid rgba(255,255,255,.10);background:var(--seg);transition:background .12s,box-shadow .12s,color .12s}
.seg button[aria-pressed="true"]{color:var(--seg-on-ink);border-color:rgba(255,255,255,.34);
  background:linear-gradient(180deg,#59a4ff,#1f63c8);box-shadow:0 4px 14px rgba(47,123,214,.45),0 1px 0 rgba(255,255,255,.35) inset}
.seg button:disabled{opacity:.32;font-size:13px;border-style:dashed}
.seg.green button[aria-pressed="true"]{color:#0d3322;border-color:rgba(255,255,255,.5);
  background:linear-gradient(180deg,#94ecb6,#46c184);box-shadow:0 4px 14px rgba(70,193,132,.42),0 1px 0 rgba(255,255,255,.5) inset}
.hint{font-size:11px;color:var(--ink-soft);margin-top:4px}
.name-note{color:#ffc24a;font-weight:800}
.err{color:var(--err);font-weight:800;font-size:14px;text-align:center}
.err:empty{display:none}
.btn-start{font:400 22px var(--font-d);color:#fff;border:0;border-radius:16px;padding:9px;letter-spacing:.06em;
  background:linear-gradient(180deg,#5fccff,#1f74d6);box-shadow:0 6px 0 #0f4f9c,0 12px 28px rgba(60,180,255,.45),0 1px 0 rgba(255,255,255,.55) inset;
  transition:transform .06s,box-shadow .06s;margin-bottom:4px}
.btn-start:active{transform:translateY(5px);box-shadow:0 1px 0 var(--btn-shadow)}
/* タイトルのスタートボタンはワインレッド */
#title .btn-start{background:linear-gradient(180deg,#b3324f,#75122c);
  box-shadow:0 6px 0 #4c0a1c,0 12px 26px rgba(150,25,60,.45),0 1px 0 rgba(255,255,255,.35) inset}
#title .btn-start:active{box-shadow:0 1px 0 #4c0a1c}
/* ストレス解消モード（黒ボタン・記録なし） */
.btn-relax{font:400 17px var(--font-d);color:#5a2a00;border:0;border-radius:14px;padding:7px;letter-spacing:.04em;
  background:linear-gradient(180deg,#ffe066,#ffb02e 55%,#ff8c1a);
  box-shadow:0 5px 0 #b45a05,0 10px 24px rgba(255,150,40,.42),0 1px 0 rgba(255,255,255,.7) inset;
  text-shadow:0 1px 0 rgba(255,255,255,.45);
  transition:transform .06s,box-shadow .06s;margin-bottom:4px}
.btn-relax:active{transform:translateY(4px);box-shadow:0 1px 0 #b45a05}
.btn-relax small{display:block;font:800 10px var(--font-b);color:#8a4400;letter-spacing:.06em;margin-top:1px;text-shadow:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-sub{font:800 14px var(--font-b);padding:8px;border-radius:12px;border:1px solid var(--panel-edge);
  background:rgba(255,255,255,.05);color:var(--ink)}
.howto{display:none}
.two-up{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack{display:flex;flex-direction:column;gap:7px;flex:1}
.stack > div{display:flex;flex-direction:column;flex:1}
.two-up{align-items:stretch}
.two-up > div{display:flex;flex-direction:column}
.two-up .seg{flex:1}
.two-up .seg button{height:100%}
/* ボール・選手・効果音は「おまけの設定」として囲んで区別する */
.opts{position:relative;border:1px dashed rgba(126,176,255,.32);border-radius:14px;
  background:rgba(120,170,255,.06);padding:11px 9px 9px;margin-top:3px}
.opt-row{margin-top:7px}
.opt-ttl{position:absolute;top:-7px;left:11px;padding:0 6px;font:800 9px var(--font-b);letter-spacing:.16em;
  color:#9fc2f5;background:var(--panel);border-radius:6px}


/* プレイ中 */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top)*.45 + 1px) 10px 0;display:none;pointer-events:none}
#hud.show{display:block}
.sb{display:grid;grid-template-columns:1.25fr 1fr 1fr;background:rgba(9,17,32,.88);border:2px solid #39445f;border-radius:13px;
  box-shadow:0 3px 0 rgba(0,0,0,.3);max-width:318px;margin:0 auto;overflow:hidden}
.sb .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 2px 6px;border-left:2px solid #1f283d}
.sb .cell:first-child{border-left:0}
.sb .k{font:800 10px var(--font-b);color:#9fb0d4;letter-spacing:.06em}
  .sb .v{font:400 28px/1.0 var(--font-d);color:var(--amber);text-shadow:0 0 10px rgba(255,180,35,.55);font-variant-numeric:tabular-nums;display:inline-block}
.sb .v.warn{color:#ff5a3c;text-shadow:0 0 12px rgba(255,90,60,.7)}
.pop{animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(1.6)}to{transform:scale(1)}}
.quit{pointer-events:auto;position:absolute;left:10px;top:calc(env(safe-area-inset-top)*.45 + 66px);font:800 12px var(--font-b);color:#dfe6f5;
  background:rgba(11,17,32,.65);border:1px solid #39445f;border-radius:999px;padding:6px 12px}
#count{position:absolute;left:0;right:0;top:42%;text-align:center;font:400 90px var(--font-d);color:#eaf1fb;
  text-shadow:0 6px 0 #1f63c8,0 0 30px rgba(0,0,0,.6);pointer-events:none;display:none}
#count.show{display:block;animation:cnt .6s ease-out}
#count.small{font-size:54px}
@keyframes cnt{0%{transform:scale(1.8);opacity:0}35%{transform:scale(1);opacity:1}100%{opacity:1}}
#tip{position:absolute;left:12px;right:64px;bottom:calc(env(safe-area-inset-bottom) + 12px);text-align:center;font:800 14px/1.5 var(--font-b);
  color:#fff7ea;background:rgba(11,17,32,.72);border-radius:12px;padding:9px 10px;pointer-events:none;display:none;white-space:pre-line}
#tip.show{display:block}

/* 結果 */
#result,#ranking{padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 14px)}
#result .card{margin:0 12px auto}
#result .r-head{font-size:24px}
#result .r-score{font-size:76px}
.r-head{font:400 28px var(--font-d);text-align:center;color:var(--paint)}
.r-score{text-align:center;font:400 92px/1 var(--font-d)}
.r-score .unit{font-size:28px;margin-left:4px}
.r-cond{text-align:center;font-weight:800;color:var(--ink-soft);margin-top:-6px}
.r-stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;background:var(--seg);border-radius:14px;padding:10px 4px;border:1px solid rgba(255,255,255,.08)}
.r-stats b{display:block;font:400 22px var(--font-d)}
.r-stats span{font-size:11px;font-weight:800;color:var(--ink-soft)}
.r-grade{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:2px}
.grade-badge{font:400 46px/1 var(--font-d);width:78px;height:78px;border-radius:50%;display:grid;place-items:center;color:#fff7ea;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.grade-comment{font:400 19px var(--font-d);color:var(--ink)}
.rk-g{font:400 15px var(--font-d);color:#fff7ea;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.r-bonus{text-align:center;font:800 15px var(--font-b);color:var(--paint);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
.r-bonus.show{opacity:1;transform:none}
.r-final{display:none;text-align:center;background:linear-gradient(180deg,#123059,#081228);border-radius:16px;padding:9px 6px 11px;margin:6px 0 2px;
  box-shadow:0 0 0 2px var(--amber) inset,0 8px 22px rgba(0,0,0,.45)}
.r-final.show{display:block;animation:pop .45s ease-out}
.r-final .fl{display:block;font:800 11px var(--font-b);color:#9fb0d4;letter-spacing:.08em}
.r-final span#rFinal{font:400 54px/1.05 var(--font-d);color:var(--amber);text-shadow:0 0 16px rgba(255,180,35,.6)}
.r-final .unit{font:800 14px var(--font-b);color:var(--amber);margin-left:3px}
.r-best{text-align:center;font-weight:800}
.r-best.new{color:var(--paint);font:400 22px var(--font-d)}
.r-rank{text-align:center;font-size:14px;font-weight:700;color:var(--ink-soft);line-height:1.55;white-space:pre-line}

/* ランキング */
.rk-title{font:400 28px var(--font-d);text-align:center}
#rkList{list-style:none;display:flex;flex-direction:column;gap:5px}
#rkList li{display:grid;grid-template-columns:26px minmax(0,1fr) 52px 60px;align-items:center;gap:8px;padding:9px 10px;border-radius:14px;background:var(--seg)}
.rk-who{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.rk-who b{font:800 15px var(--font-b);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-who small{font-size:11px;font-weight:700;color:var(--ink-soft)}
.rk-s{text-align:right;font:400 24px var(--font-d);color:var(--amber);font-variant-numeric:tabular-nums}
.rk-s i{font:800 11px var(--font-b);font-style:normal;margin-left:2px;color:var(--ink-soft)}
.rk-k{text-align:right;font:800 12px var(--font-b);color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
#rkList li.me{box-shadow:inset 0 0 0 3px var(--amber)}
.rk-n{font:400 20px var(--font-d);text-align:center}
#rkList li:nth-child(1) .rk-n{color:#d9a400}
#rkList li:nth-child(2) .rk-n{color:#8f99ad}
#rkList li:nth-child(3) .rk-n{color:#b8733a}
.rk-name{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-s{font:400 20px var(--font-d);white-space:nowrap}
.rk-s small{font:800 11px var(--font-b);color:var(--ink-soft);margin-left:2px}
.rk-admin{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;margin-bottom:2px}
.rk-admin[hidden]{display:none}
.rk-admin input{padding:7px 10px;font-size:14px;letter-spacing:.3em;text-align:center}
.btn-sub.danger{border-color:rgba(255,120,110,.55);color:#ffb3aa;background:rgba(255,80,70,.12)}
#rkMsg{font-size:14px;color:var(--ink-soft);text-align:center;font-weight:700;line-height:1.5}
#rkMsg:empty{display:none}
/* 画面が低いとき（iPhoneのブラウザなど）は、スクロールしないようにさらに詰める */
@media (max-height:690px){
  .banner{padding:4px 10px 16px}
  .banner h1{font-size:clamp(19px,6vw,25px)}
  .b-sub{font-size:11px;letter-spacing:.28em}
  .banner::after{bottom:9px;height:6px}
  .panel{gap:5px}
  .sheet{padding:9px 12px calc(8px + env(safe-area-inset-bottom))}
  .card{padding:12px}
  .seg{gap:4px}
  .seg button{padding:5px 3px;font-size:13px;border-radius:10px}
  input{padding:6px 10px;font-size:14px}
  .lbl{margin-bottom:3px;font-size:9px}
  .hint{font-size:10px;margin-top:3px}
  .sb .cell{padding:3px 2px 4px}
  .sb .k{font-size:9px}
  .sb .v{font-size:23px}
  .quit{top:calc(env(safe-area-inset-top)*.45 + 56px)}
  .btn-start{padding:7px;font-size:19px;border-radius:14px}
  .btn-relax{padding:5px;font-size:15px;border-radius:12px}
  .btn-relax small{font-size:9px}
  .btn-sub{padding:6px;font-size:13px}
  #result .r-head{font-size:17px}
  #result .r-score{font-size:46px}
  .r-score .unit{font-size:17px}
  .r-cond{font-size:11px;margin-top:-3px}
  .r-bonus{font-size:12px}
  .r-final{padding:4px 6px 6px;border-radius:12px}
  .r-final .fl{font-size:10px}
  .r-final span#rFinal{font-size:32px}
  .r-final .unit{font-size:12px}
  .grade-badge{width:44px;height:44px;font-size:25px;box-shadow:0 3px 0 rgba(0,0,0,.28)}
  .grade-comment{font-size:15px}
  .r-grade{gap:8px}
  .r-stats{padding:6px 4px}
  .r-stats b{font-size:18px}
  .r-stats span{font-size:10px}
  .r-best{font-size:13px}
  .r-best.new{font-size:17px}
  .r-rank{font-size:12px}
  .rk-title{font-size:22px}
  #rkList li{padding:6px 9px}
  .rk-s{font-size:20px}
}


/* さらに低い画面（小さいiPhoneのブラウザ）向け */
@media (max-height:575px){
  .banner-wrap{padding-top:calc(env(safe-area-inset-top) + 1px)}
  .banner{padding:3px 10px 12px}
  .banner h1{font-size:18px}
  .b-sub{display:none}
  .seg button{padding:4px 3px;font-size:12px}
  .lbl{font-size:8px;margin-bottom:2px}
  .hint{display:none}
  .sb .cell{padding:2px 2px 3px}
  .sb .v{font-size:21px}
  .quit{top:calc(env(safe-area-inset-top)*.45 + 50px)}
  .btn-start{padding:6px;font-size:17px}
  .btn-relax{padding:4px;font-size:14px}
  .btn-relax small{display:none}
  .btn-sub{padding:5px;font-size:12px}
  input{padding:5px 9px;font-size:13px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="court" aria-label="フリースローのコート"></canvas>

  <div id="hud">
    <div class="sb">
      <div class="cell"><span class="k">残り</span><span class="v" id="hudTime">20.0</span></div>
      <div class="cell"><span class="k">得点</span><span class="v" id="hudScore">0</span></div>
      <div class="cell"><span class="k">連続</span><span class="v" id="hudStreak">0</span></div>
    </div>
    <button class="quit" id="quitBtn" type="button">やめる</button>
  </div>
  <div id="count"></div>
  <div id="tip"></div>

  <section id="title" class="screen show">
    <div class="banner-wrap">
      <div class="rod"></div>
      <div class="banner">
        <div class="b-sub">リトサン</div>
        <h1>shooting<span class="b-ch">challenge!!</span></h1>
      </div>
    </div>
    <div class="panel sheet">
      <label><span class="lbl">ニックネーム</span><input id="nameInput" maxlength="10" placeholder="なまえを入れよう" autocomplete="off" enterkeyhint="done">
        <p class="hint name-note">※入れないとランキングに記録が残りません</p></label>
      <div><span class="lbl">シュート位置</span><div class="seg spots" id="spotSeg"></div><p class="hint" id="spotHint"></p></div>
      <div><span class="lbl">コート</span><div class="seg four" id="stageSeg"></div></div>
      <div class="opts">
        <span class="opt-ttl">オプション</span>
        <div><span class="lbl">ボール</span><div class="seg four green" id="ballSeg"></div></div>
        <div class="opt-row"><span class="lbl">選手</span><div class="seg green" id="playerSeg"></div></div>
      </div>
      <p class="err" id="nameErr"></p>
      <button class="btn-start" id="startBtn" type="button">スタート</button>
      <button class="btn-relax" id="relaxBtn" type="button">ストレス解消モード<small>ずっと炎・やさしいゲージ／記録なし</small></button>
      <div class="row">
        <button class="btn-sub" id="rankBtn" type="button">ランキング</button>
        <button class="btn-sub" id="soundBtn" type="button" aria-pressed="true">音：オン</button>
      </div>
      <p class="howto">画面を長押しでパワーをためて、<br>緑のゾーンで離すとシュート！</p>
    </div>
  </section>

  <section id="result" class="screen">
    <div class="panel card">
      <p class="r-head">タイムアップ！</p>
      <div class="r-score"><span id="rScore">0</span><span class="unit">点</span></div>
      <p class="r-cond" id="rCond"></p>
      <p class="r-bonus" id="rBonus"></p>
      <div class="r-final" id="rFinalWrap"><span class="fl">最終スコア</span><span id="rFinal">0</span><span class="unit">点</span></div>
      <div class="r-grade"><div class="grade-badge" id="rGrade"></div><div class="grade-comment" id="rGradeMsg"></div></div>
      <div class="r-stats">
        <div><b id="rShots">0</b><span>シュート数</span></div>
        <div><b id="rRate">0%</b><span>成功率</span></div>
        <div><b id="rStreak">0</b><span>最高連続</span></div>
      </div>
      <p class="r-best" id="rBest"></p>
      <p class="r-rank" id="rRank"></p>
      <button class="btn-start" id="againBtn" type="button">もう一度</button>
      <div class="row">
        <button class="btn-sub" id="toRankBtn" type="button">ランキング</button>
        <button class="btn-sub" id="toTitleBtn" type="button">タイトルへ</button>
      </div>
    </div>
  </section>

  <section id="ranking" class="screen">
    <div class="panel card">

const STAGE_ART = {};
/* 使うコートの画像だけ読み込み、貼りやすいように2枚つないだ帯も作る */
function stageArt(key){
  let a = STAGE_ART[key];
  if (a) return a;
  const src = STAGE_ART_SRC[key];
  if (!src) return null;
  a = STAGE_ART[key] = {wall:null, floor:null, wallTex:null, floorTex:null};
  const w = new Image();
  w.onload = () => {
    a.wall = w;
    const c = document.createElement('canvas');
    c.width = w.naturalWidth*2; c.height = w.naturalHeight;
    const x = c.getContext('2d'); x.drawImage(w, 0, 0); x.drawImage(w, w.naturalWidth, 0);
    a.wallTex = c; if (G.W && G.stage === key) buildBg();
  };
  w.src = src.wall;
  const f = new Image();
  f.onload = () => {

const SFX = {
  ctx:null, master:null, noise:null, real:{}, realTried:false,
  init(){

  /* 録音した音を1回だけ読み込む */
  loadReal(){
    if (this.realTried || !this.ctx) return;
    this.realTried = true;
    for (const k in REAL_SFX){
      try{
        const bin = atob(REAL_SFX[k].split(',')[1]), buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);

      }catch(e){}
    }

  /* 読み込み中なら、合成音を鳴らさずに少しだけ待って録音を鳴らす */
  waitSample(k, vol){
    if (!this.realTried || this.real[k]) return false;
    let n = 0;
    const again = () => {
      if (this.real[k]){ this.sample(this.real[k], vol); return; }
      if (++n < 14) setTimeout(again, 50);
    };
    setTimeout(again, 50);
    return true;

  recent(k){

    if (L >= 3) for (let i = 0; i < L * 2; i++) this.hiss(.04,'highpass',1800,.7,.05,.002,Math.random() * dur);

/* ---------- レイアウト ---------- */
function layout(){
  const W = G.W, H = G.H, sp = spotCfg(), P = sp.pos;
  const L = Math.hypot(P[0], P[1]) || 1, dir = [-P[0]/L, -P[1]/L];
  const C = [P[0] - dir[0]*CAM.back, P[1] - dir[1]*CAM.back, CAM.h];
  const f = v3.norm(v3.sub([0, 0, CAM.lookZ], C));
  const r = v3.norm(v3.cross(f, [0, 0, 1]));
  const u = v3.cross(r, f);
  G.cam = {C, f, r, u, F:H*CAM.fov};
  /* 画面の中心。低い画面ではスコア枠のぶんだけさらに下げて、ボールが隠れないようにする */
  G.cy = H*(.5 - CAM.lift) + Math.max(0, 40 - H*.045);
  G.dir = dir; G.lat = [-dir[1], dir[0]];
  G.shotDist = L;
  G.feet = [P[0], P[1]];
  G.hold = handPoint(shCfg().hand) || holdPoint();   // 構えでボールを持つ位置
  G.release = handPoint(shCfg().relIdx) || G.hold;   // 手から放す位置（リリースの絵の手）
  const pr = project(G.hold);
  G.ballX0 = pr ? pr.x : W/2; G.ballY0 = pr ? pr.y : H*.8;
  G.ballR0 = (pr ? pr.s : 200)*COURT.ballR;
  const hp = project([0, 0, COURT.rimH]);
  G.hoopX = hp ? hp.x : W/2; G.hoopY = hp ? hp.y : H*.3; G.rimR = (hp ? hp.s : 120)*COURT.rimR;
  const c = Math.hypot(f[0], f[1]) || 1, dh = [f[0]/c, f[1]/c, 0];
  G.horizon = Math.max(H*.16, Math.min(H*.66, G.cy - G.cam.F*v3.dot(dh, u)/v3.dot(dh, f)));
}

function resize(){
  G.DPR = Math.min(window.devicePixelRatio || 1, 2);
  G.W = stage.clientWidth; G.H = stage.clientHeight;
  cv.width = Math.round(G.W * G.DPR); cv.height = Math.round(G.H * G.DPR);
  layout(); buildBg();
}
function roundRect(c, x, y, w, h, r){
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

/* ---------- 体育館（背景） ---------- */
/* ゴール1つぶんのライン。cy＝リング中心のy、sgn＝コートの内側へ向かう向き */
function drawHalfLines(b, cy, sgn, st, WHITE, LW){
  const L = COURT;
  const base = cy - sgn*L.rimFromBase;            // エンドライン
  const ft = cy + sgn*(L.ftFromBase - L.rimFromBase);   // フリースローライン
  seg3(b, [-L.sideX,base,0], [L.sideX,base,0], WHITE, LW);
  const lane = [[-L.laneHalf,base,0],[L.laneHalf,base,0],[L.laneHalf,ft,0],[-L.laneHalf,ft,0]];
  if (st.lanePaint) fill3(b, lane, st.lanePaint);
  poly3(b, lane, WHITE, LW, true);
  poly3(b, circlePts(0,ft,L.ftCircleR,0,28), WHITE, LW, true);
  for (const t of [.25,.45,.65]){
    const y = base + (ft - base)*t;
    seg3(b, [L.laneHalf,y,0], [L.laneHalf+.4,y,0], WHITE, LW);
    seg3(b, [-L.laneHalf,y,0], [-L.laneHalf-.4,y,0], WHITE, LW);
  }
  // ノーチャージセミサークル（半径1.25m）
  const nc = [];
  for (let i = 0; i <= 18; i++){ const a = Math.PI*i/18; nc.push([Math.cos(a)*L.noCharge, cy + sgn*Math.sin(a)*L.noCharge, 0]); }
  poly3(b, nc, WHITE, LW);
  // スリーポイント（コーナーの直線＋アーク）
  const yJoin = Math.sqrt(Math.max(0, L.arc3*L.arc3 - L.corner3X*L.corner3X));
  seg3(b, [L.corner3X,base,0], [L.corner3X, cy + sgn*yJoin, 0], WHITE, LW);
  seg3(b, [-L.corner3X,base,0], [-L.corner3X, cy + sgn*yJoin, 0], WHITE, LW);
  const a0 = Math.atan2(yJoin, L.corner3X), pts = [];
  for (let i = 0; i <= 36; i++){
    const a = a0 + (Math.PI - 2*a0)*i/36;
    pts.push([Math.cos(a)*L.arc3, cy + sgn*Math.sin(a)*L.arc3, 0]);
  }
  poly3(b, pts, WHITE, LW);
}
/* 反対側のゴール（背景として小さく描く） */
function drawFarGoal(b){

  const by = cy + 0.376;                                        // 板の面
  const hw = L.boardW/2, z0 = L.boardZ - L.boardH/2, z1 = L.boardZ + L.boardH/2;
  seg3(b, [-hw*.55,by,z1], [-hw*.75,by+2.2,z1+1.1], 'rgba(75,84,104,.75)', .1);
  seg3(b, [hw*.55,by,z1], [hw*.75,by+2.2,z1+1.1], 'rgba(75,84,104,.75)', .1);
  const face = [[-hw,by,z1],[hw,by,z1],[hw,by,z0],[-hw,by,z0]];
  fill3(b, face, 'rgba(205,225,250,.22)');
  poly3(b, face, 'rgba(243,246,251,.8)', .04, true);
  poly3(b, [[-L.boardInW,by,L.rimH],[L.boardInW,by,L.rimH],[L.boardInW,by,L.rimH+L.boardInH],[-L.boardInW,by,L.rimH+L.boardInH]], 'rgba(243,246,251,.8)', .03, true);

/* 画面のこの高さ（縦位置）に見えている床の点を返す */
function floorPointAtRow(yCss){
  const cam = G.cam; if (!cam) return null;
  const k = (G.cy - yCss)/cam.F;
  const d = [cam.f[0] + cam.u[0]*k, cam.f[1] + cam.u[1]*k, cam.f[2] + cam.u[2]*k];
  if (d[2] > -1e-4) return null;                 // 水平より上を向いている
  const t = -cam.C[2]/d[2];
  if (!(t > 0) || t > 200) return null;
  return [cam.C[0] + d[0]*t, cam.C[1] + d[1]*t, 0];
}
/* 床に写真のテクスチャを遠近つきで敷く。手前ほど大きく、奥ほど詰まって見える */
function drawFloorTex(b, W, H, fy, st){
  const art = stageArt(G.stage);
  if (!art || !art.floorTex) return false;
  const tw = art.floor.naturalWidth, th = art.floor.naturalHeight, M = st.floorM;
  const axV = Math.abs(G.dir[1]) >= Math.abs(G.dir[0]) ? 1 : 0;   // 奥ゆきに使う軸
  const axU = 1 - axV;                                            // 左右に使う軸
  const step = 3;
  for (let y = Math.floor(fy); y < H; y += step){
    const p0 = floorPointAtRow(y + .5), p1 = floorPointAtRow(y + step + .5);
    if (!p0 || !p1) continue;
    const pr0 = project(p0); if (!pr0) continue;
    const e = [0,0,0]; e[axU] = M;
    const pr1 = project([p0[0]+e[0], p0[1]+e[1], 0]); if (!pr1) continue;
    const signed = pr1.x - pr0.x, tileW = Math.abs(signed);
    if (!(tileW > 1.5) || !isFinite(tileW)) continue;
    const dv = Math.abs(p1[axV] - p0[axV]);
    if (!(dv > 0) || dv > M*.9) continue;                         // 奥すぎて詰まりすぎる帯は飛ばす
    const fv = ((p0[axV]/M) % 1 + 1) % 1, sy = fv*th, sh = Math.max(1, dv/M*th);
    const fu = ((p0[axU]/M) % 1 + 1) % 1;
    const edge = pr0.x - Math.sign(signed)*fu*tileW;              // タイルの継ぎ目の位置
    let x = edge - (signed > 0 ? 0 : tileW);
    x -= Math.ceil(x/tileW)*tileW;
    for (; x < W; x += tileW) b.drawImage(art.floorTex, 0, sy, tw, sh, x, y, tileW + 1, step + 1);
  }
  // 奥ほど暗く、手前ほど明るく
  const g = b.createLinearGradient(0, fy, 0, H);
  g.addColorStop(0, `rgba(30,18,6,${st.floorShade})`);
  g.addColorStop(.35, 'rgba(30,18,6,.12)');
  g.addColorStop(1, 'rgba(255,238,205,.10)');
  b.fillStyle = g; b.fillRect(0, fy, W, H - fy);
  return true;
}
/* 体育館：奥の壁（写真）と天井を描く。戻り値は床の始まる高さ */
/* 壁はカメラが向いている側に立てる。正面＝エンドラインの奥、コーナー＝コートの反対側 */
/* 奥の壁の形を求める。壁はコートと平行な面。短冊に分けて遠近をつける */
function wallGeom(st){
  const L = COURT, cam = G.cam;
  const along = Math.abs(G.dir[1]) >= Math.abs(G.dir[0]) ? 1 : 0;   // 0=x方向、1=y方向を向いている
  const wv = along === 1
    ? (G.dir[1] < 0 ? L.baseY - st.wallBack : L.baseY + L.courtLen + st.wallBack)
    : Math.sign(G.dir[0])*(L.sideX + st.wallBack);
  const ax = 1 - along;                                             // 壁が横に広がる軸
  const dh = [cam.f[0], cam.f[1]], dl = Math.hypot(dh[0], dh[1]) || 1;
  dh[0] /= dl; dh[1] /= dl;
  const t = (wv - cam.C[along])/(dh[along] || 1e-3);
  const c0 = cam.C[ax] + dh[ax]*t;                                  // カメラ正面が壁に当たる位置
  const at = (a, z) => { const p = [0, 0, z]; p[ax] = a; p[along] = wv; return project(p); };
  const step = .2, span = 36, strips = [];
  let fy = Infinity, ty = Infinity;
  let prev = null, pa = 0;
  for (let s = -span; s <= span + step; s += step){
    const a = c0 + s, top = at(a, st.wallH), bot = at(a, 0);
    const cur = (top && bot) ? {a, top, bot} : null;
    if (prev && cur && Math.max(prev.top.x, cur.top.x) > -30 && Math.min(prev.top.x, cur.top.x) < G.W + 30){
      strips.push({a0:prev.a, a1:cur.a, t0:prev.top, b0:prev.bot, t1:cur.top, b1:cur.bot});
      fy = Math.min(fy, prev.bot.y, cur.bot.y);
      ty = Math.min(ty, prev.top.y, cur.top.y);
    }
    prev = cur;
  }
  return {strips, fy:isFinite(fy) ? fy : G.horizon, ty:isFinite(ty) ? ty : 0, wv, ax};
}
/* 壁の写真を短冊ごとに貼る。バックボードと平行に見えるようになる */
function drawWall(b, geom, st){
  const art = stageArt(G.stage) || {};
  const tex = art.wallTex;
  const tw = art.wall ? art.wall.naturalWidth : 1, th = art.wall ? art.wall.naturalHeight : 1;
  const S = geom.strips;
  if (!S.length) return;
  b.save();
  b.imageSmoothingEnabled = true; b.imageSmoothingQuality = 'high';
  // 壁の外形でいったん切り抜く（上辺・下辺がガタつかない）
  b.beginPath();
  b.moveTo(S[0].t0.x, S[0].t0.y);
  for (const s of S) b.lineTo(s.t1.x, s.t1.y);
  for (let i = S.length - 1; i >= 0; i--) b.lineTo(S[i].b1.x, S[i].b1.y);
  b.lineTo(S[0].b0.x, S[0].b0.y);
  b.closePath(); b.clip();
  const dir = (S[S.length-1].t1.x - S[0].t0.x) >= 0 ? 1 : -1;   // 壁の向きと画面の右向きの関係
  for (const s of S){
    // 画面の左側になる辺を基準にする（左右が反転しないように）
    const Lt = dir > 0 ? s.t0 : s.t1, Lb = dir > 0 ? s.b0 : s.b1;
    const Rt = dir > 0 ? s.t1 : s.t0, Rb = dir > 0 ? s.b1 : s.b0;
    const x0 = Lt.x, x1 = Rt.x;
    if (x1 - x0 < .02) continue;
    const hh = Math.max(Lb.y - Lt.y, Rb.y - Rt.y)*1.02;   // 切り抜きからはみ出す高さで貼る
    b.save();
    b.transform(x1 - x0, Rt.y - Lt.y, 0, hh, x0, Lt.y);
    if (tex){
      const aa = dir > 0 ? s.a0 : -s.a1;
      const u0 = ((aa/st.wallW + .5) % 1 + 1) % 1;
      const u1 = u0 + (s.a1 - s.a0)/st.wallW;
      b.drawImage(tex, u0*tw, 0, (u1 - u0)*tw, th, 0, 0, 1.06, 1);   // 少し重ねてつなぎ目を消す
    } else {
      b.fillStyle = '#c79a63'; b.fillRect(0, 0, 1.06, 1);
    }
    b.restore();
  }
  b.restore();
  // 壁と床の境目の影（屋外のコートでは弱くする）
  const ed = st.edge === undefined ? 1 : st.edge;
  if (ed > 0){
    b.beginPath();
    S.forEach((s, i) => { if (!i) b.moveTo(s.b0.x, s.b0.y); b.lineTo(s.b1.x, s.b1.y); });
    b.lineWidth = 6; b.strokeStyle = `rgba(55,35,15,${.30*ed})`; b.stroke();
    b.lineWidth = 2; b.strokeStyle = `rgba(40,25,10,${.45*ed})`; b.stroke();
  }
}
function buildBg(){
  const W = G.W, H = G.H, D = G.DPR;

  bg.width = Math.round(W*D); bg.height = Math.round(H*D);
  const b = bg.getContext('2d'); b.setTransform(D,0,0,D,0,0);
  const hz = G.horizon, st = stageCfg();
  let seed = 11; const rnd = () => (seed = (seed*16807) % 2147483647)/2147483647;
  let fy = hz, geom = null;                                // 床が始まる高さ
  if (st.wall){
    geom = wallGeom(st); fy = geom.fy;
    const cg = b.createLinearGradient(0, 0, 0, Math.max(2, geom.ty));   // 天井
    cg.addColorStop(0, st.ceil[0]); cg.addColorStop(1, st.ceil[1]);
    b.fillStyle = cg; b.fillRect(0, 0, W, Math.max(0, fy));
  } else {
  let g = b.createLinearGradient(0,0,0,hz);
  g.addColorStop(0,'#101a30'); g.addColorStop(.6,'#21345a'); g.addColorStop(1,'#2b4270');
  b.fillStyle = g; b.fillRect(0,0,W,hz);

  b.strokeStyle = 'rgba(150,170,210,.13)'; b.lineWidth = 2;
  for (let i = 0; i < 8; i++){ b.beginPath(); b.moveTo(W*i/8,0); b.lineTo(W*(i+.5)/8,H*.07); b.lineTo(W*(i+1)/8,0); b.stroke(); }
  b.beginPath(); b.moveTo(0,H*.07); b.lineTo(W,H*.07); b.stroke();
  for (let i = 0; i < 4; i++){
    const x = W*(i+.5)/4, y = H*.075, R = W*.22;
    const rg = b.createRadialGradient(x,y,0,x,y,R);
    rg.addColorStop(0,'rgba(255,241,210,.35)'); rg.addColorStop(1,'rgba(255,241,210,0)');
    b.fillStyle = rg; b.fillRect(x-R,y-R,R*2,R*2);
    b.fillStyle = '#fff6df'; roundRect(b,x-14,y-3,28,6,3); b.fill();
  }
  const py = Math.min(H*.13, hz - 40);
  b.strokeStyle = 'rgba(240,230,210,.5)'; b.lineWidth = 1;
  b.beginPath(); b.moveTo(0,py); b.quadraticCurveTo(W/2,py+14,W,py); b.stroke();
  const fc = ['#c8372d','#f2b233','#2f7bd6','#f4efe4','#1f9e6e'], fn = Math.ceil(W/26);
  for (let i = 0; i < fn; i++){
    const x = (i+.5)*W/fn, t = x/W, y = py + 28*t*(1-t);
    b.fillStyle = fc[i%5]; b.globalAlpha = .85;
    b.beginPath(); b.moveTo(x-8,y); b.lineTo(x+8,y); b.lineTo(x,y+16); b.closePath(); b.fill();
  }
  b.globalAlpha = 1;

  const bh = Math.min(H*.14, hz*.5), bTop = hz - bh, rows = 6, rh = bh/rows;
  const skin = ['#e4c9a8','#c79a74','#8a5a3c','#f0dcc2'], shirt = ['#c8372d','#2f7bd6','#f2b233','#e9e9e9','#1f9e6e','#6b4fbf'];
  for (let rr = 0; rr < rows; rr++){
    const y = bTop + rr*rh;
    b.fillStyle = rr%2 ? '#2a2f3b' : '#353b49'; b.fillRect(0,y,W,rh);
    for (let x = 4; x < W; x += 8 + rnd()*3){

  }

  // 床
  const fg = b.createLinearGradient(0,fy,0,H);

      const rg = b.createRadialGradient(0,0,0,0,0,W*.18);
      rg.addColorStop(0,'rgba(255,238,205,.2)'); rg.addColorStop(1,'rgba(255,238,205,0)');

  // サイドライン（コートの端から端まで）
  seg3(b, [-L.sideX,L.baseY,0], [-L.sideX,farBase,0], WHITE, LW);

}

/* ---------- ゴール・ボール描画 ---------- */
function drawRimBack(){
  const pts = circlePts(0, 0, COURT.rimR, COURT.rimH, 28);
  ctx.lineCap = 'round';
  poly3(ctx, pts, '#d24d12', COURT.rimPipe, true);
}
function drawRimFront(){
  // 手前側の半円だけ上から描き直して、ボールがリングをくぐる感じを出す
  const n = 28, pts = [];
  for (let i = 0; i <= n; i++){
    const a = i/n*Math.PI*2;
    const p = [Math.cos(a)*COURT.rimR, Math.sin(a)*COURT.rimR, COURT.rimH];
    if (camZ(p) < camZ([0,0,COURT.rimH])) pts.push(p); else if (pts.length) break;
  }
  if (pts.length > 1) poly3(ctx, pts, '#ff6b22', COURT.rimPipe);
}
function drawNet(){
  const L = COURT, rows = 4, N = 12;
  const stretch = L.netLen*.45*G.netK*(.6 + .4*Math.sin(G.netPh));
  const sway = .12*G.netK*Math.sin(G.netPh*.7)*G.netSide;
  const grid = [];
  for (let k = 0; k <= rows; k++){
    const t = k/rows, rad = L.rimR*(1 - .42*t), z = L.rimH - (L.netLen + stretch)*t;
    const cx = G.lat[0]*sway*t*t, cy = G.lat[1]*sway*t*t, row = [];
    for (let i = 0; i < N; i++){
      const a = (i + (k%2)*.5)/N*Math.PI*2;
      row.push(project([cx + Math.cos(a)*rad, cy + Math.sin(a)*rad, z]));
    }
    grid.push(row);
  }
  ctx.strokeStyle = 'rgba(250,250,250,.85)';
  ctx.lineWidth = Math.max(1, G.rimR*.03);
  ctx.beginPath();
  for (let k = 0; k < rows; k++) for (let i = 0; i < N; i++){
    const p = grid[k][i], q1 = grid[k+1][i], q2 = grid[k+1][(k%2) ? (i+1)%N : (i-1+N)%N];
    if (!p || !q1 || !q2) continue;
    ctx.moveTo(p.x,p.y); ctx.lineTo(q1.x,q1.y); ctx.moveTo(p.x,p.y); ctx.lineTo(q2.x,q2.y);
  }
  ctx.stroke();
}
/* 回転している縫い目1本ぶんの曲線。yy＝高さ、w＝横幅、bow＝反り */
function seamCurve(a, rad){
  const s = Math.sin(a), c = Math.cos(a);
  if (c <= .02) return {y:rad*(s >= 0 ? 1 : -1), w:rad*.02, bow:0, c};
  return {y:rad*s, w:rad*Math.sqrt(Math.max(0, 1 - s*s))*.99, bow:rad*.30*s, c};
}
/* スイカの縦じま1本（たてに走るギザギザの帯）。a＝いまの向き、hw＝帯の太さ */
function melonStripe(rad, a, hw, zig){
  const M = 18;
  ctx.beginPath();
  for (let i = 0; i <= M; i++){
    const ph = -Math.PI/2 + Math.PI*i/M, j = Math.sin(ph*4.2 + zig)*.085, lam = a - hw + j;
    const px = rad*Math.cos(ph)*Math.sin(lam), py = rad*Math.sin(ph);
    i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
  }
  for (let i = M; i >= 0; i--){
    const ph = -Math.PI/2 + Math.PI*i/M, j = Math.sin(ph*4.2 + zig)*.085, lam = a + hw + j;
    ctx.lineTo(rad*Math.cos(ph)*Math.sin(lam), rad*Math.sin(ph));
  }
  ctx.closePath(); ctx.fill();
}
function drawMelon(rad, rot, B){
  const g = ctx.createRadialGradient(-rad*.35,-rad*.42,rad*.08,0,0,rad);
  g.addColorStop(0,B.hi); g.addColorStop(.45,B.mid); g.addColorStop(1,B.low);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,rad,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = B.stripe;
  const NM = 12;
  for (let k = 0; k < NM; k++){
    const a = rot + k*Math.PI*2/NM, ca = Math.cos(a);
    if (ca <= .02) continue;
    ctx.globalAlpha = Math.min(1, ca*3.2);
    melonStripe(rad, a, .15, k*1.7);
  }
  ctx.globalAlpha = 1;
  const sh = ctx.createRadialGradient(-rad*.35,-rad*.4,rad*.1,0,0,rad);
  sh.addColorStop(0,'rgba(255,255,255,.16)'); sh.addColorStop(.6,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(0,0,0,.3)');
  ctx.fillStyle = sh; ctx.beginPath(); ctx.arc(0,0,rad,0,7); ctx.fill();
  ctx.restore();
  if (rot === 0){                       // 手に持っているときだけ、くるんとしたツルを見せる
    ctx.strokeStyle = '#1f7a12'; ctx.lineWidth = Math.max(1.2, rad*.1); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -rad*.98);
    ctx.bezierCurveTo(rad*.05, -rad*1.3, rad*.5, -rad*1.25, rad*.3, -rad*1.5);
    ctx.bezierCurveTo(rad*.15, -rad*1.68, -rad*.1, -rad*1.5, rad*.12, -rad*1.42);
    ctx.stroke();
  }
}
function drawBall(x, y, rad, rot, fire, sx=1, sy=1){
  const B = ballCfg();
  ctx.save(); ctx.translate(x,y); ctx.scale(sx,sy);
  if (fire){
    const gl = ctx.createRadialGradient(0,0,rad*.8,0,0,rad*1.9);
    gl.addColorStop(0,'rgba(255,150,40,.55)'); gl.addColorStop(1,'rgba(255,80,20,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0,0,rad*1.9,0,7); ctx.fill();
  }
  if (B.melon){
    drawMelon(rad, rot, B);
    ctx.strokeStyle = B.edge; ctx.lineWidth = Math.max(1, rad*.05);
    ctx.beginPath(); ctx.arc(0,0,rad*.97,0,7); ctx.stroke();
    ctx.restore(); return;
  }
  const g = ctx.createRadialGradient(-rad*.35,-rad*.4,rad*.08,0,0,rad);
  g.addColorStop(0,B.hi); g.addColorStop(.5,B.mid); g.addColorStop(1,B.low);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,rad,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.clip();
  const N = 6;
  if (B.panel){                                   // 試合球のベージュの帯（回転と一緒に流れる）
    ctx.fillStyle = B.panel; ctx.globalAlpha = .95;
    const off = Math.PI/N;
    for (const k of B.ks){
      const ctr = rot + off + k*Math.PI*2/N;
      if (Math.cos(ctr) <= .08) continue;         // 裏側に回った帯は描かない
      const A = seamCurve(ctr - B.hw, rad), C = seamCurve(ctr + B.hw, rad);
      ctx.beginPath();
      ctx.moveTo(-A.w, A.y); ctx.quadraticCurveTo(0, A.y + A.bow, A.w, A.y);
      ctx.lineTo(C.w, C.y);  ctx.quadraticCurveTo(0, C.y + C.bow, -C.w, C.y);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const sh = ctx.createRadialGradient(-rad*.35,-rad*.4,rad*.1,0,0,rad);
    sh.addColorStop(0,'rgba(255,255,255,.18)'); sh.addColorStop(.6,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(0,0,0,.28)');
    ctx.fillStyle = sh; ctx.beginPath(); ctx.arc(0,0,rad,0,7); ctx.fill();
  }
  /* 縦回転（バックスピン）。横のすじは水平のまま、上から下へ流れる */
  ctx.strokeStyle = B.seam; ctx.lineWidth = Math.max(1,rad*.06); ctx.lineCap = 'round';
  for (let k = 0; k < N; k++){
    const a = rot + k*Math.PI*2/N, s = Math.sin(a), c = Math.cos(a);
    if (c <= .04) continue;                       // 裏側に回ったすじは描かない
    const yy = rad*s, w = rad*Math.sqrt(Math.max(0, 1 - s*s))*.99;
    const bow = rad*.30*s;
    ctx.globalAlpha = Math.min(1, c*2.2);
    ctx.beginPath(); ctx.moveTo(-w, yy); ctx.quadraticCurveTo(0, yy + bow, w, yy); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.moveTo(0,-rad); ctx.lineTo(0,rad); ctx.stroke();   // 軸に沿った縦すじ
  for (const u of B.side) for (const sx2 of [-1, 1]){
    const xx = sx2*rad*u, hh = rad*Math.sqrt(Math.max(0, 1 - u*u));
    ctx.beginPath(); ctx.moveTo(xx, -hh);
    ctx.quadraticCurveTo(xx + sx2*rad*u*.35, 0, xx, hh); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = B.edge || 'rgba(80,30,8,.5)'; ctx.lineWidth = Math.max(1,rad*.05);
  ctx.beginPath(); ctx.arc(0,0,rad*.97,0,7); ctx.stroke();
  ctx.restore();
}
function drawShadow(pos, alpha){
  const g = project([pos[0], pos[1], 0]); if (!g) return;
  const h = Math.max(0, pos[2]);
  const a = Math.max(.04, (.32 - h*.035))*(alpha === undefined ? 1 : alpha);
  const rad = g.s*COURT.ballR*(1 + h*.12);
  ctx.fillStyle = `rgba(40,20,5,${a})`;
  ctx.beginPath(); ctx.ellipse(g.x, g.y, rad*1.05, rad*.34, 0, 0, 7); ctx.fill();
}

/* ---------- シュートの軌道 ---------- */
function decide(p, a){
  const cfg = diffCfg(), c = cfg.center, hw = zoneW()/2, e = Math.abs(p - c);
  let type = e <= hw*.5 ? 'swish' : e <= hw ? 'rimIn' : e <= hw + .09 ? 'rimOut' : (p < c ? 'short' : 'long');
  const side = a !== 0 ? Math.sign(a) : (Math.random() < .5 ? -1 : 1);
  let aimMiss = false;
  if (cfg.aim){
    const aa = Math.abs(a);
    if (aa > AIM_OK){ if (type === 'swish' || type === 'rimIn'){ type = 'rimOut'; aimMiss = true; } }
    else if (aa > .6 && type === 'swish') type = 'rimIn';
  }
  return {type, side, aimMiss};
}

/* ---------- ボールの動き（重力と反発で計算する） ---------- */
const GRAV = 9.8;                                   // 重力（m/秒²）
const BOUNCE = {rim:.42, board:.55, floor:.68};     // 反発の強さ（1で跳ね返り100%）
/* ねらう点。リング中心から見て fx=左右、fy=奥ゆき（＋でリングの向こう側）、z=高さ */
function aimAt(fx, fy, z){ return [G.lat[0]*fx + G.dir[0]*fy, G.lat[1]*fx + G.dir[1]*fy, z]; }
/* 出発点から目標点まで T 秒で届く初速（放物線） */
function launchVel(p0, p1, T){
  return [(p1[0]-p0[0])/T, (p1[1]-p0[1])/T, (p1[2]-p0[2])/T + .5*GRAV*T];
}
/* 目標点に「角度 deg で落ちてくる」山なりの初速。実際のシュートに近い弧になる */
function launchArc(p0, p1, deg){
  const dx = p1[0]-p0[0], dy = p1[1]-p0[1], dz = p1[2]-p0[2];
  const d = Math.hypot(dx, dy), k = Math.tan(deg*Math.PI/180);
  const T = Math.sqrt(Math.max(.05, 2*(dz + d*k)/GRAV));
  return {v:launchVel(p0, p1, T), T};
}
/* 結果ごとに「どこをねらうか」と「落ちてくる角度」を決める。あとは物理にまかせる */
function aimTarget(out){
  const L = COURT, s = out.side, R = L.rimR;
  const j = (Math.random()-.5)*.04, ang = 48 + (Math.random()-.5)*3;
  switch (out.type){
    case 'swish':  return {p:aimAt(j, j, L.rimH), ang};                        // 輪の真ん中を通る
    case 'rimIn':  return {p:aimAt(s*R*.78, -R*.3, L.rimH + .03), ang};        // 輪の内側に当たってから落ちる
    case 'rimOut': return {p:aimAt(s*R*1.05, -R*.35, L.rimH + .02), ang};      // 輪のふちに当たってはじかれる
    case 'short':  return {p:aimAt(s*.08, -(R + .10), L.rimH - .02), ang:ang+4};// 手前のふちに当たって落ちる
    case 'long':   return {p:aimAt(s*.10, L.boardY + .18, L.rimH + .72), ang:ang-6}; // 板の上のほうに当たる
    default:       return {p:aimAt(s*(R + .42), -.1, L.rimH + .04), ang};      // 横にそれる
  }
}
/* リングに当たった瞬間、決めておいた結果になるよう軽く手を加える */
function rimAssist(b){
  const L = COURT, p = b.pos, v = b.vel;
  const hd = Math.hypot(p[0], p[1]) || 1, nx = p[0]/hd, ny = p[1]/hd;
  if (b.out.type === 'rimIn'){
    // 輪の内側に当たったので、そのまま中へ落ちるように向きを変える
    if (hd > L.rimR){ p[0] = nx*L.rimR; p[1] = ny*L.rimR; }
    v[0] = -nx*2.2; v[1] = -ny*2.2; v[2] = -1.8;
    b.throughRim = true;                 // 通り抜けるあいだは輪の当たり判定を切る
    return;
  }
  // 入らない結果のときは、外へしっかりはじく
  const vr = v[0]*nx + v[1]*ny;
  if (vr < 1.3){ const add = 1.3 - vr; v[0] += nx*add; v[1] += ny*add; }
  if (v[2] < 0) v[2] = Math.max(v[2]*.5, -1.2);
}
function ballSpeed(v){ return Math.hypot(v[0], v[1], v[2]); }
/* 1コマ分すすめる（衝突はこの中で処理する） */
function stepBall(b, h){
  const L = COURT, p = b.pos, v = b.vel, z0 = p[2];
  v[2] -= GRAV*h;
  p[0] += v[0]*h; p[1] += v[1]*h; p[2] += v[2]*h;

  // ゴール判定：リングの面を上から下へ、輪の内側を通ったら得点
  if (!b.resolved && !b.mustMiss && z0 > L.rimH && p[2] <= L.rimH && v[2] < 0){
    if (Math.hypot(p[0], p[1]) < L.rimR - L.ballR*.5){
      b.resolved = true; b.scored = true;
      SFX.play(b.hitRim ? 'swishS' : 'swish');
      onScore(b.side);
    }
  }
  // リング（輪のパイプに当たる）
  const hd = Math.hypot(p[0], p[1]);
  if (!b.throughRim && Math.abs(p[2] - L.rimH) < L.ballR + L.rimPipe && Math.abs(hd - L.rimR) < L.ballR + L.rimPipe){
    const u = hd > 1e-6 ? [p[0]/hd, p[1]/hd] : [1, 0];
    const cx = u[0]*L.rimR, cy = u[1]*L.rimR;
    let nx = p[0]-cx, ny = p[1]-cy, nz = p[2]-L.rimH;
    let d = Math.hypot(nx, ny, nz);
    const r = L.ballR + L.rimPipe*.5;
    if (d < r){
      if (d < 1e-6){ nx = u[0]; ny = u[1]; nz = 0; d = 1; }
      nx /= d; ny /= d; nz /= d;
      p[0] = cx + nx*r; p[1] = cy + ny*r; p[2] = L.rimH + nz*r;
      const vn = v[0]*nx + v[1]*ny + v[2]*nz;
      if (vn < 0){
        const e = BOUNCE.rim;
        v[0] -= (1+e)*vn*nx; v[1] -= (1+e)*vn*ny; v[2] -= (1+e)*vn*nz;
        v[0] *= .80; v[1] *= .80; v[2] *= .90;
        if (ballSpeed(v) > 1.2) SFX.play('rim');
        if (!b.hitRim){ b.hitRim = true; rimAssist(b); }
        G.netK = Math.max(G.netK, .35);
      }
    }
  }
  // バックボード（板の面。板の大きさの中だけ）
  if (p[1] - L.ballR < L.boardY && v[1] < 0 &&
      Math.abs(p[0]) < L.boardW/2 + L.ballR &&
      p[2] > L.boardZ - L.boardH/2 - L.ballR && p[2] < L.boardZ + L.boardH/2 + L.ballR){
    p[1] = L.boardY + L.ballR;
    v[1] = -v[1]*BOUNCE.board; v[0] *= .85; v[2] *= .85;
    if (!b.hitBoard){ b.hitBoard = true; SFX.play('board'); }
  }
  // 床
  if (p[2] < L.ballR && v[2] < 0){
    if (b.melon){ splitMelon(b); return; }      // スイカは跳ねずにその場で割れる
    p[2] = L.ballR;
    v[2] = -v[2]*BOUNCE.floor; v[0] *= .78; v[1] *= .78;
    b.floorHits++;
    if (b.floorHits <= 3 && ballSpeed(v) > 1) SFX.play(b.floorHits === 1 ? 'floor' : 'floorS');
    if (v[2] < 1.2){ v[2] = 0; b.rolling = true; }
  }
  if (b.throughRim && p[2] < L.rimH - L.netLen) b.throughRim = false;
  if (b.rolling){ v[0] *= (1 - 1.1*h); v[1] *= (1 - 1.1*h); }
  // 入らなかったと分かった時点で「ミス」を出す
  if (!b.resolved && p[2] < L.rimH - .45 && v[2] < 0){ b.resolved = true; onMiss(b.out); }
}
/* スイカが地面に当たった：跳ねずに3〜4つに割れる */
function splitMelon(b){
  b.pos[2] = COURT.ballR;
  b.vel[0] = b.vel[1] = b.vel[2] = 0;
  const pr = project(b.pos);
  if (pr){
    melonPieces(3 + (Math.random() < .5 ? 0 : 1), pr.x, pr.y, pr.s*COURT.ballR);
    sparks(reduced ? 4 : 9, pr.x, pr.y);
  }
  SFX.tone(220, .22, 'sawtooth', .16, 0, 60); SFX.hiss(.22, 'lowpass', 900, 1, .22);
  if (!b.resolved){ b.resolved = true; onMiss(b.out); }
  b.dead = true; b.fade = 0; b.done = true;
}
function updBall(b, dt){
  if (b.dead){ b.fade -= dt*2.5; if (b.fade <= 0) b.done = true; return; }
  const L = COURT;
  const n = Math.max(1, Math.min(6, Math.ceil(dt/.006))), h = dt/n;
  for (let i = 0; i < n; i++) stepBall(b, h);
  b.rot += b.vrot*dt;
  b.life += dt;
  const hd = Math.hypot(b.pos[0], b.pos[1]);
  b.behind = b.pos[2] < L.rimH && b.pos[2] > L.rimH - L.netLen - .35 && hd < L.rimR*1.5;
  const pr = project(b.pos);
  if (pr){ b.sx = pr.x; b.sy = pr.y; b.rad = pr.s*L.ballR; }
  if (b.fire && !reduced && pr && b.life < .5){ flame(pr.x, pr.y, b.rad); flame(pr.x, pr.y, b.rad); }
  if (b.life > 3.6 || (b.rolling && ballSpeed(b.vel) < .6)){
    if (!b.resolved){ b.resolved = true; onMiss(b.out); }
    b.dead = true;
  }
}

/* ---------- ゲーム進行 ---------- */
function shoot(){
  const cfg = diffCfg(), out = decide(G.shotPower, cfg.aim ? G.shotAim : 0);
  G.shots++; G.pending++;
  const pr = project(G.release);
  const p0 = G.release.slice(), tgt = aimTarget(out), la = launchArc(p0, tgt.p, tgt.ang);
  const b = {pos:p0, vel:la.v, out, side:out.side, mustMiss:(out.type !== 'swish' && out.type !== 'rimIn'), throughRim:false,
    sx:pr ? pr.x : G.ballX0, sy:pr ? pr.y : G.ballY0, rad:G.ballR0,
    rot:0, vrot:15, melon:!!ballCfg().melon,
    life:0, floorHits:0, hitRim:false, hitBoard:false, rolling:false,
    scored:false, resolved:false, behind:false, fade:1, dead:false, done:false, fire:G.fire};
  G.balls.push(b);
  G.nextBallT = .5; G.power = 0;
}
/* 連続本数ごとのメッセージと演出 */
const STREAK_MSG = {
  1:  {txt:'ナイッシュー！',        size:36, color:'#eaf1fb', life:1.0},
  2:  {txt:'連続成功！',            size:40, color:'#ffe08a', life:1.1, conf:45},
  10: {txt:'もう誰も止められない！', size:48, color:'#ffd34a', life:1.7, conf:180, flash:1, shake:16},
  15: {txt:'天才シューター！！',    size:52, color:'#ffd34a', life:2.0, conf:230, flash:1, shake:20},
  20: {txt:'神シューター！！',      size:56, color:'#fff0a8', life:2.2, conf:300, flash:1, shake:26}
};
/* それ以外は「◯連続！」。本数が増えるほど数字も演出も大きくなる */
function streakMsg(s){
  if (STREAK_MSG[s]) return STREAK_MSG[s];
  const t = Math.min(1, Math.max(0, (s - 3)/17));
  return {num:String(s), txt:'連続！',
    size:30 + Math.round(t*12),
    color: s >= 16 ? '#ffd34a' : s >= 11 ? '#ffc23a' : s >= 6 ? '#ffa62a' : '#ffe08a',
    life:1.1 + t*.5,
    conf:Math.round(55 + t*150),
    flash: s >= 5 ? .7 + t*.3 : 0,
    shake: s >= 7 ? 7 + Math.round(t*11) : 0};
}
/* 演出の強さ。ストレス解消モードは1本目から「5本連続」の派手さで始める */
const fxLv = s => G.relax ? Math.max(s, 5) : s;
function onScore(side){
  G.pending--; G.score += spotCfg().pts; G.makes++; G.streak++; G.shrink++;
  G.maxStreak = Math.max(G.maxStreak, G.streak);
  G.netK = 1; G.netPh = 0; G.netSide = side;
  sparks(reduced ? 5 : 14, G.hoopX, G.hoopY + G.rimR*.5);
  const s = G.streak, late = G.state === 'ending', cx = G.hoopX, cy = G.hoopY;
  /* アリーナだけ、5本連続ごとに歓声を鳴らす */
  if (G.stage === 'arena' && s > 0 && s % 5 === 0) SFX.play('cheer5');
  else if (G.stage === 'out' && s > 0 && s % 5 === 0){ SFX.play('bird5'); birds(reduced ? 6 : 10); }
  else if (G.stage === 'beach' && s > 0 && s % 5 === 0) SFX.play('wave5');
  else SFX.cheer(fxLv(s) + (late ? 4 : 0));
  if (late){ addText('ブザービーター！', {slot:'main', size:36, color:'#ffb423', life:1.6}); confetti(90,cx,cy); G.flash = 1; }
  else {
    const m = streakMsg(s), fx = streakMsg(fxLv(s));   // 文字は本数どおり、演出はモードで底上げ
    if (s === 5) G.fire = true;
    addText(m.txt, {slot:'main', num:m.num, size:fx.size, color:fx.color, life:fx.life});
    if (fx.conf) confetti(fx.conf, cx, cy);
    if (fx.flash) G.flash = fx.flash;
    if (fx.shake) G.shake = fx.shake;
  }
  if (!late){ const gg = gaugeGeom(); addText('スピードアップ', {slot:'speed', x:gg.gx - 44, y:(gg.gy0 + gg.gy1)/2, size:13, life:.9, vy:-24, body:true, color:'#ffb423'}); }
  bump('hudScore');
}
function onMiss(out){
  G.pending--; G.streak = 0; G.fire = G.relax;   // ストレス解消モードは炎が消えない
  if (!spotCfg().keepZone) G.shrink = 0;      // 遠い位置はゾーンの狭さを保つ
  const msg = out.aimMiss ? 'ねらいがズレた！' : ({rimOut:'おしい！', short:'弱すぎ！', long:'強すぎ！', wide:'ねらいがズレた！'}[out.type] || 'ドンマイ！');
  addText(msg, {slot:'main', size:30, color:'#cfe3ff'});
  if (out.type === 'rimOut') G.shake = 5;
}
function bump(id){ const el = $(id); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('show', s.id === id)); }
function setHud(on){ $('hud').classList.toggle('show', on); }
function setTip(text){ const el = $('tip'); el.textContent = text || ''; el.classList.toggle('show', !!text); }   // 改行は \n で入れる
function showCount(text, small){

  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function hideCount(){ $('count').classList.remove('show'); }

function startGame(){
  Object.assign(G, {state:'count', countT:3, lastCount:4, lastTick:99, score:0, shots:0, streak:0, maxStreak:0, makes:0, pending:0,
    timeLeft:G.time, balls:[], texts:[], fire:G.relax, spotLight:0, nextBallT:0, padT:1, charging:false, power:0, endT:0, flash:0, shake:0, shrink:0});
  G.aimPhase = Math.random()*6;
  show(''); setHud(true); updateHud(true);
  setTip(G.relax ? 'ストレス解消モード！\n記録は残らないので好きなだけ打とう' : '長押しでパワーをためて\n緑のゾーンで離そう！');
}
function quitGame(){
  G.state = 'title'; G.balls = []; G.charging = false; G.power = 0; G.texts = []; G.fire = false; G.relax = false; G.spotLight = 0;
  setHud(false); setTip(''); hideCount(); show('title');
}
const hudCache = {};
function setHudText(id, v){ if (hudCache[id] !== v){ hudCache[id] = v; $(id).textContent = v; } }
function updateHud(force){
  if (force) for (const k in hudCache) delete hudCache[k];
  setHudText('hudTime', G.timeLeft.toFixed(1));
  setHudText('hudScore', String(G.score));
  setHudText('hudStreak', String(G.streak));
  $('hudTime').classList.toggle('warn', G.timeLeft <= 3 && (G.state === 'play' || G.state === 'ending'));
}

function update(dt){
  const cfg = diffCfg();
  G.padT += dt; G.shootT += dt;
  if (G.releaseT > 0){ G.releaseT -= dt; if (G.releaseT <= 0){ G.releaseT = 0; shoot(); } }
  if (G.nextBallT > 0){ G.nextBallT -= dt; if (G.nextBallT <= 0) G.padT = 0; }
  if (cfg.aim){ G.aimPhase += dt*cfg.aimSpeed*Math.min(1.6, 1 + G.makes*cfg.aimUp); G.aim = Math.sin(G.aimPhase); }

  if (G.state === 'count'){
    G.countT -= dt;
    const c = Math.ceil(G.countT);
    if (c !== G.lastCount){
      G.lastCount = c;
      if (c > 0){ showCount(String(c)); SFX.play('count'); }
      else { showCount('スタート！', true); SFX.play('go'); G.state = 'play'; setTimeout(() => { if (G.state !== 'count') hideCount(); }, 700); }
    }
  } else if (G.state === 'play'){
    G.timeLeft -= dt;
    const sec = Math.ceil(G.timeLeft);
    if (G.timeLeft <= 3 && sec > 0 && sec !== G.lastTick){ G.lastTick = sec; SFX.beep(990,.08); }
    if (G.charging){
      const sp = cfg.speed*(1 + (levelNow() - 1)*cfg.up);       // レベルで速くなる（11で頭打ち）
      G.power += G.pdir*sp*dt;
      if (G.power >= 1){ G.power = 1; G.pdir = -1; } else if (G.power <= 0){ G.power = 0; G.pdir = 1; }
    }
    if (G.timeLeft <= 0){
      G.timeLeft = 0; G.state = 'ending'; G.charging = false; G.power = 0;
      SFX.buzzer(); setTip('');
      if (G.pending === 0) addText('タイムアップ！', {slot:'main', size:40, color:'#ffb423', life:1.4});
    }
  } else if (G.state === 'ending'){
    if (G.pending === 0){ G.endT += dt; if (G.endT > 1.4) finishGame(); }
  }

  for (const b of G.balls) updBall(b, dt);
  G.balls = G.balls.filter(b => !b.done);

  for (const p of G.parts){
    p.age += dt; const dr = Math.exp(-p.drag*dt);
    p.vx *= dr; p.vy = p.vy*dr + p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.rot !== undefined) p.rot += p.vr*dt;
    if (p.k === 'w' && p.y > p.ground){        // スイカのかけらは地面で止まる
      p.y = p.ground;
      if (p.vy > 60){ p.vy *= -.22; p.vx *= .55; p.vr *= .4; }
      else { p.vy = 0; p.vx *= .82; p.vr *= .8; }
    }
  }
  G.parts = G.parts.filter(p => p.age < p.life && p.y < G.H + 60);
  if (G.parts.length > 600) G.parts.splice(0, G.parts.length - 600);
  for (const t of G.texts){ t.age += dt; t.y += t.vy*dt; }
  G.texts = G.texts.filter(t => t.age < t.life);

  G.flash = Math.max(0, G.flash - dt*2.2);
  G.shake = Math.max(0, G.shake - dt*30);
  G.netK *= Math.exp(-dt*4.5); G.netPh += dt*16;
  const spotTarget = (G.streak >= 8 && (G.state === 'play' || G.state === 'ending')) ? 1 : 0;
  G.spotLight += (spotTarget - G.spotLight)*Math.min(1, dt*3);

  if (G.state === 'play' || G.state === 'ending' || G.state === 'count') updateHud();
}

function draw(){
  const W = G.W, H = G.H;
  ctx.setTransform(G.DPR,0,0,G.DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if (G.shake > 0 && !reduced) ctx.translate((Math.random()-.5)*G.shake, (Math.random()-.5)*G.shake);
  ctx.drawImage(bg, 0, 0, W, H);
  drawFlash();

  for (const b of G.balls) drawShadow(b.pos, b.fade);
  const pv = padVisible() && holdShown(), pg = padGeom();
  if (pv) drawShadow(pg.pos, 1);

  drawRimBack();
  for (const b of G.balls) if (b.behind){ ctx.globalAlpha = b.fade; drawBall(b.sx,b.sy,b.rad,b.rot,b.fire); ctx.globalAlpha = 1; }
  drawNet(); drawRimFront();

  /* 選手より奥にあるボールは、選手のシルエットの後ろに隠れるように先に描く */
  const pz = camZ([G.feet[0], G.feet[1], 1.2]);
  const farBall = b => !b.behind && camZ(b.pos) > pz;
  for (const b of G.balls) if (farBall(b)){ ctx.globalAlpha = b.fade; drawBall(b.sx,b.sy,b.rad,b.rot,b.fire); ctx.globalAlpha = 1; }
  /* 「打てるよ」の合図の輪は、ボールが見えていなくても出す */
  if (padVisible() && G.state === 'play' && !G.charging && G.releaseT <= 0){
    const pul = .5 + .5*Math.sin(G.now*5);
    ctx.strokeStyle = `rgba(255,180,35,${.35 + .4*pul})`; ctx.lineWidth = 3;
    const gp = project([G.hold[0], G.hold[1], 0]);
    if (gp){ ctx.beginPath(); ctx.ellipse(gp.x, gp.y, pg.rad*1.3, pg.rad*.36, 0, 0, 7); ctx.stroke(); }
  }
  if (pv) drawBall(pg.x, pg.y, pg.rad, 0, G.fire, 1 + pg.sq, 1 - pg.sq);
  drawParts('w');                 // 割れたスイカは選手より奥
  /* 選手はいちばん手前。持っているボールも選手の後ろに隠れる */
  drawShooter();

  for (const b of G.balls) if (!b.behind && !farBall(b)){ ctx.globalAlpha = b.fade; drawBall(b.sx,b.sy,b.rad,b.rot,b.fire); ctx.globalAlpha = 1; }

  drawParts();
  drawSpots();
  if (G.state === 'play' || G.state === 'ending' || G.state === 'count'){ drawAim(); drawGauge(); }
  drawTexts();
  ctx.restore();
}

let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now; G.now = now/1000;
  update(dt); draw();
  requestAnimationFrame(frame);
}

/* ---------- 結果・記録 ---------- */
/* ランクの基準は最終スコア（得点＋最高連続×2）。シュート位置ごとに変える */
const GRADES = {
  ft:    [[32,'S'],[26,'A'],[18,'B']],
  elbow: [[40,'S'],[32,'A'],[22,'B']],
  far:   [[40,'S'],[32,'A'],[22,'B']]
};
const gradeKey = s => s === 'ft' ? 'ft' : (s === 'relbow' || s === 'lelbow') ? 'elbow' : 'far';
const GRADE_STYLE = {S:{c:'#ffb423', m:'パーフェクト！'}, A:{c:'#b8322a', m:'エース級！'}, B:{c:'#2f7bd6', m:'いい調子！'}, C:{c:'#5a6480', m:'次はもっといける！'}};
function gradeOf(spot, finalScore){
  for (const [need, g] of (GRADES[gradeKey(spot)] || GRADES.ft)) if (Number(finalScore) >= need) return g;
  return 'C';
}
const finalOf = (score, streak) => Number(score) + Number(streak || 0)*2;   // 連続ボーナス
const cmp = (a, b) => (b.score - a.score) || (a.at - b.at);
const keyOf = t => 'all-' + t;
function cleanRows(rows){
  return (Array.isArray(rows) ? rows : [])
    .filter(v => v && typeof v.name === 'string' && Number.isFinite(Number(v.score)))
    .map(v => ({name:String(v.name).slice(0,10), score:Math.max(0, Math.min(999, Math.floor(Number(v.score)))),
      streak:Number.isFinite(Number(v.streak)) ? Math.max(0, Math.floor(Number(v.streak))) : 0,
      spot:SPOTS[v.spot] ? SPOTS[v.spot].label : String(v.spot || ''), key:SPOTS[v.spot] ? v.spot : '',
      at:Number(v.at) || 0}));
}
async function fetchShared(key){
  const data = await api(`${RANKING_API}?key=${encodeURIComponent(key)}&_=${Date.now()}`);
  return cleanRows(data.rows).sort(cmp).slice(0,10);
}
async function postShared(entry){
  return api(RANKING_API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({name:entry.name, score:entry.score, streak:entry.streak, diff:G.spot, spot:G.spot, time:G.time})});
}
function countUp(el, from, to, ms, done){
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0)/ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from)*e);
    if (k < 1) requestAnimationFrame(step); else if (done) done();
  };
  requestAnimationFrame(step);
}
function finishGame(){
  G.state = 'result'; setHud(false); setTip('');
  const key = keyOf(G.time);
  const bonus = G.maxStreak*2, finalScore = finalOf(G.score, G.maxStreak);
  const bests = LS.get('best', {}); const prev = Number(bests[key]) || 0;
  const isBest = !G.relax && finalScore > prev;
  if (isBest){ bests[key] = finalScore; LS.set('best', bests); }
  $('rCond').textContent = (G.relax ? 'ストレス解消モード・' : '') + `${spotCfg().label}・1本${spotCfg().pts}点・${G.time}秒`;
  $('rShots').textContent = G.shots;
  $('rRate').textContent = (G.shots ? Math.round(G.makes/G.shots*100) : 0) + '%';
  $('rStreak').textContent = G.maxStreak;
  const grade = gradeOf(G.spot, finalScore), gs = GRADE_STYLE[grade];
  const gb = $('rGrade'); gb.textContent = grade; gb.style.background = gs.c;
  $('rGradeMsg').textContent = gs.m;
  const rb = $('rBest');
  if (G.relax){ rb.textContent = 'ストレス解消モード（記録なし）'; rb.classList.remove('new'); }
  else if (isBest && finalScore > 0){ rb.textContent = '自己ベスト更新！'; rb.classList.add('new'); }
  else { rb.textContent = `自己ベスト ${Math.max(prev, finalScore)}点`; rb.classList.remove('new'); }
  /* 得点 → 連続ボーナス → 最終スコア の順に見せる */
  const sc = $('rScore'), bn = $('rBonus'), fn = $('rFinal'), fw = $('rFinalWrap');
  sc.textContent = '0'; bn.classList.remove('show'); fw.classList.remove('show'); fn.textContent = '0';
  show('result');
  countUp(sc, 0, G.score, 600, () => {
    setTimeout(() => {
      bn.textContent = `最高連続 ${G.maxStreak} × 2 ＝ ＋${bonus}点`;
      bn.classList.add('show'); SFX.beep(880, .12);
      setTimeout(() => {
        fw.classList.add('show'); SFX.beep(1320, .18);
        countUp(fn, G.score, finalScore, 900, () => {
          if (finalScore > 0){ SFX.play('result'); confetti(160, G.W/2, G.H*.35); G.flash = 1; G.shake = 8; }
          if (isBest && finalScore > 0) confetti(120, G.W/2, G.H*.25);
        });
      }, 620);
    }, 320);
  });
  if (G.relax){ $('rRank').textContent = 'ストレス解消モードはランキングに登録されません'; G.lastEntry = null; }
  else if (!G.name){ $('rRank').textContent = 'ニックネームを入れるとランキングに記録が残ります'; G.lastEntry = null; }
  else register({name:G.name, score:finalScore, streak:G.maxStreak, spot:G.spot, at:Date.now()}, key);
}
async function register(entry, key){
  const el = $('rRank');
  if (entry.score <= 0){ el.textContent = 'ゴールを決めるとランキングに登録されます'; G.lastEntry = null; return; }
  G.lastEntry = entry;
  const all = LS.get('rank', {});
  const list = cleanRows(all[key]); list.push(entry); list.sort(cmp);
  const top = list.slice(0,10); all[key] = top; LS.set('rank', all);
  const li = top.indexOf(entry);
  const localMsg = li >= 0 ? `この端末で ${li+1}位` : 'この端末のランキングは10位まで';
  if (!SHARED){ el.textContent = localMsg; return; }
  el.textContent = localMsg + '\nみんなのランキングに登録中…';
  try{
    const res = await postShared(entry);
    entry.shared = true;
    if (G.lastEntry === entry) el.textContent = localMsg + '\n' + (res.rank > 0 ? `みんなの中で ${res.rank}位（${res.total}人中）` : 'みんなのランキングに登録したよ');
  }catch(err){
    if (G.lastEntry === entry) el.textContent = localMsg + '\nみんなのランキングに登録できませんでした。電波のいい場所でもう一度遊んでください';
  }
}

async function renderRanking(){
  const key = keyOf(RK.time), list = $('rkList'), msg = $('rkMsg'), token = ++RK.token;
  list.innerHTML = ''; msg.textContent = '';
  $('rkReset').style.visibility = RK.scope === 'all' && SHARED ? 'visible' : 'hidden';

    if (!SHARED){ msg.textContent = 'みんなのランキングは準備中です。「この端末」を見てください'; return; }
    msg.textContent = '読み込み中…';

    const sc = document.createElement('span'); sc.className = 'rk-s';

    const kk = document.createElement('span'); kk.className = 'rk-k'; kk.textContent = `${r.streak}連続`;
    li.append(n, who, sc, kk); list.appendChild(li);
  });
}

function makeSeg(el, items, get, set){
  el.innerHTML = '';
  items.forEach(([v, label, off, sub]) => {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.v = String(v);
    if (sub){ const n = document.createElement('span'); n.textContent = label;
              const s = document.createElement('small'); s.textContent = sub; b.append(n, s); }
    else b.textContent = label;
    if (off){ b.disabled = true; }
    else b.addEventListener('click', () => { set(v); sync(); });
    el.appendChild(b);
  });
  function sync(){ [...el.children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(get())))); }
  sync(); return sync;
}

}

syncSound();
$('soundBtn').addEventListener('click', () => { G.sound = !G.sound; LS.set('sound', G.sound); syncSound(); if (G.sound){ SFX.init(); SFX.beep(880,.08); } });

SFX.init();      // 起動時に録音を読み込んでおく（音が出るのは最初に触れてから）
['pointerdown','touchstart'].forEach(ev => window.addEventListener(ev, () => SFX.init(), {once:true, passive:true}));
function beginGame(relax){
  G.relax = !!relax;
  G.name = nameInput.value.trim().slice(0,10);
  LS.set('name', G.name); nameInput.blur(); SFX.init(); startGame();
}
$('startBtn').addEventListener('click', () => beginGame(false));
$('relaxBtn').addEventListener('click', () => beginGame(true));
$('rankBtn').addEventListener('click', () => openRanking('title'));
$('quitBtn').addEventListener('click', quitGame);
$('againBtn').addEventListener('click', () => { SFX.init(); startGame(); });
$('toRankBtn').addEventListener('click', () => openRanking('result'));
$('toTitleBtn').addEventListener('click', quitGame);
$('rkBack').addEventListener('click', () => show(RK.from));
/* 記録の初期化（パスワードはサーバー側＝Apps Script で確認する） */
$('rkReset').addEventListener('click', () => {
  const a = $('rkAdmin'); a.hidden = !a.hidden;
  $('rkMsg').textContent = ''; $('rkPass').value = '';
  if (!a.hidden) $('rkPass').focus();
});
$('rkCancel').addEventListener('click', () => { $('rkAdmin').hidden = true; $('rkPass').value = ''; $('rkMsg').textContent = ''; });
$('rkDo').addEventListener('click', async () => {
  const pass = $('rkPass').value.trim(), msg = $('rkMsg');
  if (!/^\d{6}$/.test(pass)){ msg.textContent = 'パスワードは数字6けたです'; return; }
  $('rkDo').disabled = true; msg.textContent = '初期化しています…';
  try{
    const res = await api(RANKING_API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'reset', pass})});
    LS.set('rank', {}); LS.set('best', {}); G.lastEntry = null;      // この端末の記録も消す
    $('rkAdmin').hidden = true; $('rkPass').value = '';
    msg.textContent = `記録を初期化しました（${res.removed || 0}件）`;
    setTimeout(renderRanking, 1200);
  }catch(err){
    msg.textContent = String(err && err.message) === 'bad_pass' ? 'パスワードが違います' : '初期化できませんでした。電波のいい場所でもう一度お試しください';
  }finally{ $('rkDo').disabled = false; }
});
$('rkPass').addEventListener('keydown', e => { if (e.key === 'Enter') $('rkDo').click(); });

window.addEventListener('resize', resize);
if (document.fonts && document.fonts.load){ document.fonts.load(`40px ${FONT_D}`).catch(() => {}); }
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
